<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingeniería en Sistemas de Información</title>
<style>
  :root{
    --bg:#faf9f5; --side:#f0eee6; --card:#ffffff; --text:#2b2a27; --muted:#6f6c64;
    --line:#e3e0d6; --accent:#c96442; --accent-soft:#f6e3da; --hover:#e8e5da;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#262624; --side:#1f1e1d; --card:#30302e; --text:#ece9e1; --muted:#a39f95;
      --line:#3d3c39; --accent:#d97757; --accent-soft:#3e2c25; --hover:#343331;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
  a{color:inherit;text-decoration:none}
  [data-go]{cursor:pointer;user-select:none}

  /* ---------- Barra lateral ---------- */
  .sidebar{width:260px;background:var(--side);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;transition:transform .25s;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;padding:8px 10px 16px;font-family:Georgia,"Times New Roman",serif;font-size:1.2rem}
  .brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.95rem}
  .section-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 10px 6px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:.93rem;color:var(--text)}
  .nav-item:hover{background:var(--hover)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .nav-item svg{width:18px;height:18px;flex-shrink:0}
  .side-foot{margin-top:auto;padding:12px 10px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line)}

  /* ---------- Principal ---------- */
  main{flex:1;margin-left:260px;padding:40px 48px;max-width:1320px;min-width:0}
  .topbar{display:none}
  .crumbs{font-size:.85rem;color:var(--muted);margin-bottom:8px}
  .crumbs span[data-go]:hover{color:var(--accent)}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:2.1rem;margin-bottom:10px}
  .lead{color:var(--muted);font-size:1.02rem;max-width:720px;line-height:1.55;margin-bottom:28px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card .icon{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:14px}
  .card .icon svg{width:20px;height:20px}
  .card h3{font-size:1.1rem;margin-bottom:6px}
  .card p{color:var(--muted);font-size:.9rem;line-height:1.45}
  .card .links{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .pill{font-size:.8rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
  .pill:hover{border-color:var(--accent);color:var(--accent)}

  /* Temas del parcial */
  .temas{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-top:24px}
  .temas-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .temas h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:1.3rem}
  .unidad{padding-top:14px}
  .unidad + .unidad{margin-top:14px;border-top:1px solid var(--line)}
  .unidad h3{font-size:1rem;color:var(--accent);margin-bottom:8px}
  .unidad ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
  .unidad li{font-size:.92rem;line-height:1.5}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px}
  .tab{padding:10px 16px;font-size:.93rem;border-bottom:2px solid transparent;color:var(--muted)}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}

  /* Material */
  .files{display:flex;flex-direction:column;gap:8px}
  .file{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
  .file:hover{border-color:var(--accent)}
  .badge{font-size:.7rem;font-weight:700;padding:4px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);min-width:42px;text-align:center}
  .file .name{flex:1;font-size:.95rem}
  .file .go{color:var(--muted);font-size:.85rem}

  /* Videos estilo YouTube */
  .player-wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
  .player{background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9}
  .player iframe{width:100%;height:100%;border:0;display:block}
  .now-title{font-size:1.15rem;font-weight:600;margin:14px 0 4px}
  .now-desc{color:var(--muted);font-size:.9rem}
  .playlist{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .pl-head{padding:14px 16px;border-bottom:1px solid var(--line)}
  .pl-head b{display:block;font-size:1rem}
  .pl-head span{font-size:.8rem;color:var(--muted)}
  .pl-list{max-height:460px;overflow-y:auto}
  .pl-item{display:flex;gap:10px;padding:8px 12px;cursor:pointer;align-items:center}
  .pl-item:hover{background:var(--hover)}
  .pl-item.active{background:var(--accent-soft)}
  .pl-num{width:18px;font-size:.8rem;color:var(--muted);text-align:center}
  .pl-item.active .pl-num{color:var(--accent)}
  .pl-thumb{width:120px;aspect-ratio:16/9;border-radius:8px;background:var(--line) center/cover;flex-shrink:0;display:grid;place-items:center;color:var(--muted);font-size:1.2rem}
  .pl-title{font-size:.86rem;line-height:1.3}
  .empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

  @media (max-width:1000px){ .player-wrap{grid-template-columns:1fr} }
  @media (max-width:760px){
    .sidebar{transform:translateX(-100%)}
    .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
    main{margin-left:0;padding:16px}
    .topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
    .menu-btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--text);font-size:1.1rem;cursor:pointer}
    h1{font-size:1.6rem}
    .pl-thumb{width:100px}
  }

  /* ---------- Plan de estudios (inicio) ---------- */
  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.82rem;color:var(--muted);margin:-10px 0 30px}
  .legend b{color:var(--text);font-weight:600}
  .nivel{margin-bottom:34px;scroll-margin-top:20px}
  .nivel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
  .nivel-head h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:1.45rem}
  .nivel-head span{font-size:.82rem;color:var(--muted)}
  .mlist{display:flex;flex-direction:column;gap:6px}
  .mrow{display:grid;grid-template-columns:30px minmax(0,1fr) 168px 58px 124px 124px;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:.9rem}
  .mrow[data-go]:hover{border-color:var(--accent)}
  .mrow.has{box-shadow:inset 3px 0 0 var(--accent)}
  .mhead{background:none;border:0;padding:0 17px 2px;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .mnum{font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .mname{font-weight:600;line-height:1.35}
  .mname .tag{font-weight:500;margin-left:4px;vertical-align:1px}
  .mrow .c{color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .tag{font-size:.7rem;padding:2px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .tag.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
  .nada{color:var(--line)}
  @media (max-width:760px){
    .mhead{display:none}
    .mrow{grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding:10px 12px}
    .mrow .c{grid-column:2;font-size:.8rem}
    .mrow .c::before{content:attr(data-l) ":";min-width:74px}
    .mrow .c.vacia{display:none}
  }
  .num{font-size:.72rem;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--hover);color:var(--text);cursor:help;font-variant-numeric:tabular-nums}
  .notas{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;font-size:.88rem;line-height:1.55;color:var(--muted)}
  .notas ul{padding-left:18px;display:flex;flex-direction:column;gap:6px}
  .notas b{color:var(--text)}

  /* Ficha de la materia */
  .ficha{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:28px}
  .ficha > div{background:var(--card);padding:12px 16px}
  .ficha small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
  .ficha span{font-size:.9rem;line-height:1.45}
  .aviso{font-size:.88rem;color:var(--muted);margin:-14px 0 24px;max-width:720px;line-height:1.5}
  .back{color:var(--muted)}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<main>
  <div class="topbar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <b id="topName"></b>
  </div>
  <div id="app"></div>
</main>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOMBRES = { teorico: "Teórico", practico: "Práctico" };
const MOD = { "A": "Anual", "1C": "1º cuatrimestre", "2C": "2º cuatrimestre", "1C-2C": "1º o 2º cuatrimestre" };
const materia = n => CARRERA.materias.find(m => m.n === n);

function ytId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : (/^[\w-]{11}$/.test(url) ? url : null);
}

const ICON_HOME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>';
const ICON_DOC  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
const ICON_BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H2zM22 4h-7a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h8z"/></svg>';
const ICON_PEN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const ICON_CHECK= '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>';
const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>';
const ICON_LAYER= '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l10 5-10 5L2 7z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>';

/* Ruta actual, tomada del link (#/...): "", "m26", "m26/p2", "m26/p2/teorico/videos", "m26/actividades" */
let ruta = "";

/* ---------- Barra lateral ---------- */
function renderSidebar(m){
  const [a, b] = ruta.split("/");
  const item = (go, icon, label, on) =>
    `<div class="nav-item ${on ? "active" : ""}" data-go="${go}">${icon}<span>${label}</span></div>`;
  const brand = `<div class="brand"><div class="logo">${esc(CARRERA.nombre.charAt(0))}</div><span>${esc(CARRERA.nombre)}</span></div>`;
  let body;

  if(m){
    const c = MATERIAS[m.n];
    body = `
      ${item("inicio", ICON_BACK, "Plan de estudios", false)}
      <div class="section-label">${esc(m.nombre)}</div>
      ${item(a, ICON_HOME, "Inicio de la materia", !b)}
      ${c ? c.parciales.map(p => item(`${a}/${p.id}`, ICON_DOC, esc(p.titulo), b === p.id)).join("") : ""}
      ${c && c.actividades ? item(`${a}/actividades`, ICON_CHECK, "Actividades", b === "actividades") : ""}`;
  } else {
    const niveles = [...new Set(CARRERA.materias.map(x => x.nivel))];
    const conContenido = CARRERA.materias.filter(x => MATERIAS[x.n]);
    body = `
      ${item("inicio", ICON_HOME, "Plan de estudios", true)}
      ${conContenido.length ? `<div class="section-label">Materias con material</div>
        ${conContenido.map(x => item(`m${x.n}`, ICON_BOOK, esc(x.nombre), false)).join("")}` : ""}
      <div class="section-label">Ir a</div>
      ${niveles.map(n => `<div class="nav-item" data-scroll="nivel-${n}">${ICON_LAYER}<span>${n}º Nivel</span></div>`).join("")}
      <div class="nav-item" data-scroll="electivas">${ICON_LAYER}<span>Electivas</span></div>`;
  }
  $("#sidebar").innerHTML = `${brand}${body}<div class="side-foot">${esc(CARRERA.plan)} · ${esc(CARRERA.pie)}</div>`;
}

/* ---------- Plan de estudios (inicio) ---------- */
function nums(list){
  return list.map(n => `<span class="num" title="${esc(materia(n) ? materia(n).nombre : "")}">${n}</span>`).join("");
}
function celdaCorr(list){
  return list.length ? nums(list) : `<span class="nada">—</span>`;
}
function encabezado(tercera){
  return `<div class="mrow mhead">
    <span>Nº</span><span>Asignatura</span><span>Cursado</span><span>${tercera}</span><span>Regulares</span><span>Aprobadas</span>
  </div>`;
}
function filaMateria(m){
  const has = !!MATERIAS[m.n];
  return `
    <div class="mrow ${has ? "has" : ""}" data-go="m${m.n}">
      <span class="mnum">${m.n}</span>
      <span class="mname">${esc(m.nombre)}${m.integradora ? ` <span class="tag">Integradora</span>` : ""}${has ? ` <span class="tag ok">Con material</span>` : ""}</span>
      <span class="c" data-l="Cursado">${MOD[m.mod]}${m.cc ? ` <span class="tag" title="Se puede cursar contra cuatrimestre">CC</span>` : ""}</span>
      <span class="c" data-l="Horas">${m.horas} hs</span>
      <span class="c ${m.regular.length ? "" : "vacia"}" data-l="Regulares">${celdaCorr(m.regular)}</span>
      <span class="c ${m.aprobada.length ? "" : "vacia"}" data-l="Aprobadas">${celdaCorr(m.aprobada)}</span>
    </div>`;
}
function filaElectiva(e){
  return `
    <div class="mrow">
      <span class="mnum"></span>
      <span class="mname">${esc(e.nombre)}</span>
      <span class="c" data-l="Cursado">${MOD[e.mod]}</span>
      <span class="c" data-l="Créditos">${e.creditos}</span>
      <span class="c" data-l="Regulares">${celdaCorr(e.regular)}</span>
      <span class="c" data-l="Aprobadas">${celdaCorr(e.aprobada)}</span>
    </div>`;
}

function viewInicio(){
  const niveles = [...new Set(CARRERA.materias.map(m => m.nivel))];
  const nivEl = [...new Set(CARRERA.electivas.map(e => e.nivel))];
  return `
    <h1>${esc(CARRERA.titulo)}</h1>
    <p class="lead">${esc(CARRERA.plan)}. ${esc(CARRERA.bienvenida)}</p>
    <div class="legend">
      <span><b>Anual / cuatrimestre:</b> cuándo se cursa</span>
      <span><b>CC:</b> se puede cursar contra cuatrimestre</span>
      <span><b>Regulares / Aprobadas:</b> números de las materias que necesitás para cursar</span>
    </div>
    ${niveles.map(n => {
      const ms = CARRERA.materias.filter(m => m.nivel === n);
      const hs = ms.reduce((t, m) => t + m.horas, 0);
      return `
        <section class="nivel" id="nivel-${n}">
          <div class="nivel-head"><h2>${n}º Nivel</h2><span>${ms.length} materias · ${hs} hs semanales</span></div>
          <div class="mlist">${encabezado("Horas")}${ms.map(filaMateria).join("")}</div>
        </section>`;
    }).join("")}
    <section class="nivel" id="electivas">
      <div class="nivel-head"><h2>Electivas</h2><span>Vigentes 2023 · mínimo 20 créditos</span></div>
      ${nivEl.map(n => `
        <div class="section-label" style="padding-left:0">${n}º Nivel</div>
        <div class="mlist">${encabezado("Créditos")}${CARRERA.electivas.filter(e => e.nivel === n).map(filaElectiva).join("")}</div>`).join("")}
    </section>
    <div class="notas"><ul>${CARRERA.notas.map(t => `<li>${t}</li>`).join("")}</ul></div>`;
}

/* ---------- Página de una materia ---------- */
function ficha(m){
  const lista = l => l.length ? l.map(n => `${n}. ${esc(materia(n) ? materia(n).nombre : "")}`).join("<br>") : "—";
  return `
    <div class="ficha">
      <div><small>Nivel</small><span>${m.nivel}º Nivel</span></div>
      <div><small>Cursado</small><span>${MOD[m.mod]}${m.cc ? " · se puede contra cuatrimestre" : ""}</span></div>
      <div><small>Carga horaria</small><span>${m.horas} hs semanales</span></div>
      <div><small>Regulares para cursar</small><span>${lista(m.regular)}</span></div>
      <div><small>Aprobadas para cursar</small><span>${lista(m.aprobada)}</span></div>
    </div>
    ${m.nota ? `<p class="aviso">${esc(m.nota)}</p>` : ""}`;
}

function viewMateria(m){
  const c = MATERIAS[m.n];
  let contenido;
  if(!c){
    contenido = `<div class="empty">Todavía no hay material cargado para esta materia.</div>`;
  } else {
    contenido = `
      <div class="grid">
        ${c.parciales.map(p => `
          <div class="card" data-go="m${m.n}/${p.id}">
            <div class="icon">${ICON_DOC}</div>
            <h3>${esc(p.titulo)}</h3>
            <p>${esc(p.descripcion)}</p>
          </div>`).join("")}
        ${c.actividades ? `
          <div class="card" data-go="m${m.n}/actividades">
            <div class="icon">${ICON_CHECK}</div>
            <h3>Actividades</h3>
            <p>Trabajos prácticos y entregas.</p>
          </div>` : ""}
      </div>`;
  }
  return `
    <div class="crumbs"><span data-go="inicio">Plan de estudios</span> / ${esc(m.nombre)}</div>
    <h1>${esc(m.nombre)}</h1>
    ${c && c.descripcion ? `<p class="lead">${esc(c.descripcion)}</p>` : `<div style="height:14px"></div>`}
    ${ficha(m)}
    ${contenido}`;
}

function crumbs(m, ...rest){
  return `<div class="crumbs"><span data-go="inicio">Plan de estudios</span> / <span data-go="m${m.n}">${esc(m.nombre)}</span> / ${rest.join(" / ")}</div>`;
}

function viewParcial(m, p){
  const tarjeta = (k, desc) => `
    <div class="card" data-go="m${m.n}/${p.id}/${k}/material">
      <div class="icon">${k === "teorico" ? ICON_BOOK : ICON_PEN}</div>
      <h3>${NOMBRES[k]}</h3>
      <p>${desc}</p>
      <div class="links">
        <span class="pill" data-go="m${m.n}/${p.id}/${k}/material">📄 Material (${p[k].material.length})</span>
        <span class="pill" data-go="m${m.n}/${p.id}/${k}/videos">▶ Videos (${p[k].videos.length})</span>
      </div>
    </div>`;
  return `
    ${crumbs(m, esc(p.titulo))}
    <h1>${esc(p.titulo)}</h1>
    <p class="lead">${esc(p.descripcion)}</p>
    <div class="grid">
      ${tarjeta("teorico",  "Material de lectura y videos de las clases teóricas.")}
      ${tarjeta("practico", "Guías de ejercicios y videos con las resoluciones.")}
    </div>
    ${temasBox(p.temas)}`;
}

/* Temas que entran en el parcial (opcional: campo "temas" del parcial) */
function temasBox(t){
  if(!t || !t.unidades || !t.unidades.length) return "";
  return `
    <section class="temas">
      <div class="temas-head">
        <h2>${esc(t.titulo || "Temas que entran")}</h2>
      </div>
      ${t.unidades.map(u => `
        <div class="unidad">
          <h3>${esc(u.titulo)}</h3>
          <ul>${u.contenidos.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
        </div>`).join("")}
    </section>`;
}

function filesList(items){
  if(!items.length) return `<div class="empty">Todavía no hay material cargado.</div>`;
  return `<div class="files">${items.map(f => `
    <a class="file" href="${esc(f.url)}" target="_blank" rel="noopener">
      <span class="badge">${esc(f.tipo || "LINK")}</span>
      <span class="name">${esc(f.nombre)}</span>
      <span class="go">Abrir ↗</span>
    </a>`).join("")}</div>`;
}

function viewSeccion(m, p, k, tab){
  const s = p[k];
  const otra = k === "teorico" ? "practico" : "teorico";
  const base = `m${m.n}/${p.id}`;
  return `
    ${crumbs(m, `<span data-go="${base}">${esc(p.titulo)}</span>`, NOMBRES[k])}
    <h1>${NOMBRES[k]}</h1>
    <p class="lead">${esc(p.titulo)} — material y videos de la parte ${NOMBRES[k].toLowerCase()}.
      <span class="pill" data-go="${base}/${otra}/material" style="margin-left:6px">Ir a ${NOMBRES[otra]} →</span></p>
    <div class="tabs">
      <div class="tab ${tab === "material" ? "active" : ""}" data-go="${base}/${k}/material">Material (${s.material.length})</div>
      <div class="tab ${tab === "videos" ? "active" : ""}"   data-go="${base}/${k}/videos">Videos (${s.videos.length})</div>
    </div>
    <div id="tabBody">${tab === "material" ? filesList(s.material) : ""}</div>`;
}

/* ---------- Reproductor con lista (estilo YouTube) ---------- */
function mountPlayer(videos, titulo){
  const body = $("#tabBody");
  if(!videos.length){ body.innerHTML = `<div class="empty">Todavía no hay videos cargados.</div>`; return; }
  body.innerHTML = `
    <div class="player-wrap">
      <div>
        <div class="player" id="player"></div>
        <div class="now-title" id="nowTitle"></div>
        <div class="now-desc" id="nowDesc"></div>
      </div>
      <div class="playlist">
        <div class="pl-head"><b>${esc(titulo)}</b><span id="plCount"></span></div>
        <div class="pl-list">
          ${videos.map((v, i) => {
            const id = ytId(v.url);
            const thumb = id
              ? `<div class="pl-thumb" style="background-image:url(https://i.ytimg.com/vi/${id}/mqdefault.jpg)"></div>`
              : `<div class="pl-thumb">▶</div>`;
            return `<div class="pl-item" data-i="${i}"><span class="pl-num">${i + 1}</span>${thumb}<div class="pl-title">${esc(v.titulo)}</div></div>`;
          }).join("")}
        </div>
      </div>
    </div>`;

  const play = i => {
    const v = videos[i], id = ytId(v.url);
    $("#player").innerHTML = id
      ? `<iframe src="https://www.youtube.com/embed/${id}?rel=0" title="${esc(v.titulo)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
      : `<div style="height:100%;display:grid;place-items:center;color:#aaa;text-align:center;padding:20px">Este video todavía no tiene link.<br>Pegá la URL de YouTube en el código.</div>`;
    $("#nowTitle").textContent = v.titulo;
    $("#nowDesc").textContent = `Video ${i + 1} de ${videos.length}`;
    $("#plCount").textContent = `${i + 1} / ${videos.length}`;
    document.querySelectorAll(".pl-item").forEach(el => el.classList.toggle("active", +el.dataset.i === i));
  };
  document.querySelectorAll(".pl-item").forEach(el => el.addEventListener("click", () => play(+el.dataset.i)));
  play(0);
}

/* ---------- Navegación ---------- */
function render(){
  ruta = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  let [a, b, c, d] = ruta.split("/");
  const app = $("#app");
  const m = a && a[0] === "m" ? materia(+a.slice(1)) : null;
  const cont = m && MATERIAS[m.n];
  const p = cont && cont.parciales.find(x => x.id === b);
  let titulo = CARRERA.titulo;

  if(p && (c === "teorico" || c === "practico")){
    d = d === "videos" ? "videos" : "material";
    ruta = `${a}/${b}/${c}/${d}`;
    app.innerHTML = viewSeccion(m, p, c, d);
    if(d === "videos") mountPlayer(p[c].videos, `${p.titulo} · ${NOMBRES[c]}`);
    titulo = `${NOMBRES[c]} · ${p.titulo} · ${m.nombre}`;
  } else if(p){
    app.innerHTML = viewParcial(m, p);
    titulo = `${p.titulo} · ${m.nombre}`;
  } else if(cont && b === "actividades" && cont.actividades){
    app.innerHTML = `${crumbs(m, "Actividades")}
      <h1>Actividades</h1><p class="lead">Trabajos prácticos, entregas y consignas.</p>${filesList(cont.actividades)}`;
    titulo = `Actividades · ${m.nombre}`;
  } else if(m){
    ruta = a;
    app.innerHTML = viewMateria(m);
    titulo = m.nombre;
  } else {
    ruta = "";
    app.innerHTML = viewInicio();
  }
  renderSidebar(m);
  document.title = titulo;
  $("#topName").textContent = m ? m.nombre : CARRERA.nombre;
  $("#sidebar").classList.remove("open");
  window.scrollTo(0, 0);
}

/* Un solo manejador de clics para todo lo que tenga data-go (cambia el link) o data-scroll */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-scroll]");
  if(s){
    $("#sidebar").classList.remove("open");
    document.getElementById(s.dataset.scroll).scrollIntoView({ behavior: "smooth" });
    return;
  }
  const el = e.target.closest("[data-go]");
  if(!el) return;
  e.preventDefault();
  e.stopPropagation();
  const go = el.dataset.go === "inicio" ? "" : el.dataset.go;
  if(go === ruta) render(); else location.hash = "#/" + go;
});
window.addEventListener("hashchange", render);
$("#menuBtn").addEventListener("click", () => $("#sidebar").classList.toggle("open"));

render();
</script>
