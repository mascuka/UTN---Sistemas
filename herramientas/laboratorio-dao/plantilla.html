<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio DAO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232d8992'/%3E%3Cpath d='M20 18h14a8 8 0 0 1 0 16H26v12h-6zM26 24v4h8a2 2 0 0 0 0-4z' fill='white'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#fcfcfb; --card:#ffffff; --text:#1f1e1c; --text2:#46453f; --muted:#7c7b75;
    --line:#e7e6e2; --line2:#d9d8d3; --accent:#2d8992; --accent-soft:#e4f3f5; --hover:#f1f0ec;
    --ok:#3f7a55; --ok-soft:#e5efe7; --warn:#8a6a1c; --warn-soft:#f6edcf; --bad:#a3452d; --bad-soft:#f7e7e3;
    --code-bg:#f6f5f1; --kw:#7a3e9d; --str:#3f7a55; --com:#8a877f; --num:#a3452d;
    --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
    --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#262624; --card:#30302e; --text:#ece9e1; --text2:#cfcbc1; --muted:#a39f95;
      --line:#3d3c39; --line2:#4a4945; --accent:#5fb8c3; --accent-soft:#17393d; --hover:#343331;
      --ok:#8cc7a0; --ok-soft:#233328; --warn:#f2dfa6; --warn-soft:#463c1e; --bad:#f0a08c; --bad-soft:#46302b;
      --code-bg:#272725; --kw:#d1a3ec; --str:#8cc7a0; --com:#8f8b82; --num:#f0a08c;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#262624; --card:#30302e; --text:#ece9e1; --text2:#cfcbc1; --muted:#a39f95;
    --line:#3d3c39; --line2:#4a4945; --accent:#5fb8c3; --accent-soft:#17393d; --hover:#343331;
    --ok:#8cc7a0; --ok-soft:#233328; --warn:#f2dfa6; --warn-soft:#463c1e; --bad:#f0a08c; --bad-soft:#46302b;
    --code-bg:#272725; --kw:#d1a3ec; --str:#8cc7a0; --com:#8f8b82; --num:#f0a08c;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:15px}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  button,input{font:inherit;color:inherit}
  .env{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
  header.cab{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
  .cab h1{font:500 1.9rem/1.15 var(--serif);letter-spacing:-.015em}
  .cab .version{display:inline-block;font-size:.78rem;color:var(--muted);margin-top:8px}
  .cab .sello{display:inline-flex;align-items:center;font-size:.78rem;color:var(--ok);background:var(--ok-soft);border-radius:99px;padding:2px 10px;margin:8px 8px 0 0}
  .tema{margin-left:auto;flex:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;color:var(--muted)}
  .tema:hover{color:var(--text);background:var(--hover)}
  .tema svg{width:17px;height:17px}
  .caja{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
  .fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 13px;cursor:pointer;font-size:.9rem;white-space:nowrap;transition:background .12s}
  .btn:hover{background:var(--hover)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.pri:hover{filter:brightness(1.06);background:var(--accent)}
  :root[data-theme="dark"] .btn.pri{color:#10292c}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.pri{color:#10292c} }
  .btn.chico{padding:3px 9px;font-size:.8rem;border-radius:7px}
  .oculto{display:none!important}
  .cargados{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:2px 4px 2px 10px;font:.8rem var(--mono);color:var(--text2);max-width:100%}
  .chip b{font:600 .66rem var(--sans);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip button{border:0;background:none;cursor:pointer;color:var(--muted);border-radius:99px;width:20px;height:20px;line-height:1}
  .chip button:hover{color:var(--bad);background:var(--bad-soft)}
  .s-estado{font-size:.88rem;color:var(--text2);margin:0 0 12px;line-height:1.5}
  .s-estado .ok{color:var(--ok);font-weight:600} .s-estado .mal{color:var(--bad);font-weight:600}
  .aviso{border-radius:10px;padding:9px 12px;font-size:.86rem;margin:0 0 12px;background:var(--warn-soft);color:var(--warn);overflow-wrap:anywhere}
  .aviso ul{margin:4px 0 0 18px}
  .aviso.mal{background:var(--bad-soft);color:var(--bad)}
  .cod-env{display:grid;grid-template-columns:220px 1fr;gap:12px;align-items:start}
  .cod-env>*{min-width:0}
  @media (max-width:760px){ .cod-env{grid-template-columns:1fr} .archivos{flex-direction:row!important;flex-wrap:wrap} }
  .archivos{display:flex;flex-direction:column;gap:2px}
  .archivos button{display:flex;align-items:center;gap:6px;border:0;background:none;text-align:left;padding:6px 9px;border-radius:8px;cursor:pointer;font:.84rem var(--mono);color:var(--text2)}
  .archivos button:hover{background:var(--hover)}
  .archivos button.on{background:var(--accent-soft);color:var(--accent)}
  .codigo{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:640px;font:.8rem/1.55 var(--mono)}
  .codigo .ln{display:flex;white-space:pre}
  .codigo .ln i{flex:none;width:44px;text-align:right;padding-right:12px;color:var(--muted);font-style:normal;user-select:none;opacity:.7}
  .codigo .kw{color:var(--kw)} .codigo .s{color:var(--str)} .codigo .c{color:var(--com);font-style:italic} .codigo .nm{color:var(--num)}
  .vacio{color:var(--muted);font-size:.92rem;padding:18px 4px}
  .nota{font-size:.84rem;color:var(--muted);margin-top:12px}
  .nota code{font:.8rem var(--mono);background:var(--code-bg);border-radius:5px;padding:1px 5px}
  .aviso-version{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
  .aviso-version a{color:inherit;font-weight:700}
  #soltar{position:fixed;inset:0;background:rgba(45,137,146,.12);border:3px dashed var(--accent);display:none;place-items:center;font:600 1.1rem var(--sans);color:var(--accent);z-index:9;pointer-events:none}
  @media (max-width:640px){ .env{padding:18px 16px 60px} .caja{padding:16px} .cab h1{font-size:1.5rem} }
</style>
</head>
<body>
<div id="soltar">Soltá los archivos del parcial</div>
<div class="env">
  <div id="avisoVersion"></div>
  <header class="cab">
    <div>
      <h1>Laboratorio DAO · Recuperatorio</h1>
      <span class="sello">● Funciona sin internet</span><span class="version">Versión del @@FECHA@@ · @@VERSION@@</span>
    </div>
    <button class="tema" id="tema" title="Cambiar tema" aria-label="Cambiar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>

  <div class="caja">
    <div class="fila">
      <button class="btn" id="bEnun">Cargar enunciado</button>
      <button class="btn" id="bCsv">Cargar CSV</button>
      <button class="btn" id="bTest">Cargar test</button>
      <button class="btn" id="bZip" title="Si te dan todo junto en un ZIP: toma el enunciado, los CSV y los tests">ZIP del parcial</button>
      <span style="flex:1"></span>
      <button class="btn pri" id="bBajar">Descargar ZIP</button>
      <button class="btn" id="bCopiar">Copiar</button>
      <button class="btn" id="bBorrar">Borrar</button>
    </div>
    <input type="file" id="fEnun" accept=".pdf,.md,.txt,.markdown,text/plain,application/pdf" class="oculto">
    <input type="file" id="fCsv" accept=".csv,.txt,text/csv" multiple class="oculto">
    <input type="file" id="fTest" accept=".py,text/x-python" multiple class="oculto">
    <input type="file" id="fZip" accept=".zip,application/zip" class="oculto">
    <div class="cargados" id="cargados"></div>
  </div>

  <div class="caja" id="solucion"></div>
</div>
<script>/*@PDFJS@*/</script>
<script>/*@WORKER@*/</script>
<script>/*@MOTOR@*/</script>
<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const VERSION = '@@VERSION@@';
  const CLAVE = 'lab-dao';
  const S = { enun: null, csvs: {}, tests: {}, archivo: null, carpeta: null };
  try { const d = JSON.parse(localStorage.getItem(CLAVE) || 'null'); if (d) Object.assign(S, d); } catch (e) { /* sin almacenamiento */ }
  const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify({ enun: S.enun, csvs: S.csvs, tests: S.tests, archivo: S.archivo, carpeta: S.carpeta })); } catch (e) { /* lleno o bloqueado */ } };

  // ───── Tema
  (function () {
    let t = null; try { t = localStorage.getItem('lab-tema'); } catch (e) {}
    if (t) document.documentElement.dataset.theme = t;
    $('#tema').onclick = () => {
      const osc = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = osc ? 'light' : 'dark';
      try { localStorage.setItem('lab-tema', document.documentElement.dataset.theme); } catch (e) {}
    };
  })();

  // ───── Leer archivos
  if (window.pdfjsLib && window.pdfjsWorker) window.pdfjsLib.GlobalWorkerOptions.workerPort = null;
  async function textoDePdf(datos) {
    const lib = window.pdfjsLib;
    if (!lib) throw new Error('falta el lector de PDF');
    const doc = await lib.getDocument({ data: datos, isEvalSupported: false, disableFontFace: true, useSystemFonts: false }).promise;
    const paginas = [];
    for (let i = 1; i <= doc.numPages; i++) {
      const pg = await doc.getPage(i), tc = await pg.getTextContent();
      let t = '', ultY = null;
      for (const it of tc.items) {
        if (!('str' in it)) continue;
        const y = it.transform ? it.transform[5] : null;
        if (ultY !== null && y !== null && Math.abs(y - ultY) > 2 && !/\n$/.test(t)) t += '\n';
        t += it.str;
        if (it.hasEOL) t += '\n';
        ultY = y;
      }
      paginas.push(t);
    }
    return paginas.join('\n\n').split('\n').filter(l => !/^\s*\d+\s*\/\s*\d+\s*$/.test(l)).join('\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n');
  }
  const deco = b => Proyecto.decodificar(b);
  async function textoDe(nombre, bytes) { return /\.pdf$/i.test(nombre) ? textoDePdf(bytes) : deco(bytes); }
  async function cargarEnun(f) { S.enun = { nombre: f.name, texto: await textoDe(f.name, new Uint8Array(await f.arrayBuffer())) }; guardar(); pintar(); }
  async function cargarVarios(fs, donde) { for (const f of fs) S[donde][f.name] = deco(new Uint8Array(await f.arrayBuffer())); guardar(); pintar(); }
  // el ZIP del parcial: el enunciado, los CSV y los tests (sin las soluciones que a veces vienen adentro)
  async function cargarZip(f) {
    const a = await Proyecto.leerZip(new Uint8Array(await f.arrayBuffer()));
    const sol = r => /soluci|resoluci|resuelt|propuesta|respuesta/i.test(r);
    const rutas = Object.keys(a).filter(r => !sol(r) && !/(^|\/)(__pycache__|\.git|\.pytest_cache)\//.test(r));
    const enun = rutas.filter(r => /\.(md|txt|pdf)$/i.test(r) && !/(^|\/)(LEEME|LICENSE|requirements)[^/]*$/i.test(r) && !/\.csv$/i.test(r))
      .sort((x, y) => (/enunciado|consigna|readme/i.test(y) - /enunciado|consigna|readme/i.test(x)) || (/\.pdf$/i.test(x) - /\.pdf$/i.test(y)))[0];
    if (enun) S.enun = { nombre: enun.split('/').pop(), texto: await textoDe(enun, a[enun]) };
    for (const r of rutas) if (/\.csv$/i.test(r)) S.csvs[r.split('/').pop()] = deco(a[r]);
    for (const r of rutas) if (/(^|\/)test[^/]*\.py$/i.test(r)) S.tests[r.split('/').pop()] = deco(a[r]);
    // si los CSV vienen en su propia carpeta (data/), el programa los busca ahí
    const rc = rutas.find(r => /\.csv$/i.test(r)), dirDe = r => r.split('/').slice(0, -1).join('/');
    S.carpeta = rc && enun && dirDe(rc) !== dirDe(enun) && dirDe(rc).startsWith(dirDe(enun)) ? dirDe(rc).slice(dirDe(enun).length).replace(/^\//, '') || null : null;
    guardar(); pintar();
  }
  $('#bEnun').onclick = () => $('#fEnun').click();
  $('#bCsv').onclick = () => $('#fCsv').click();
  $('#bTest').onclick = () => $('#fTest').click();
  $('#bZip').onclick = () => $('#fZip').click();
  $('#fEnun').onchange = ev => { const f = ev.target.files[0]; ev.target.value = ''; if (f) cargarEnun(f).catch(e => avisar(e)); };
  $('#fCsv').onchange = ev => { const fs = [...ev.target.files]; ev.target.value = ''; cargarVarios(fs, 'csvs').catch(e => avisar(e)); };
  $('#fTest').onchange = ev => { const fs = [...ev.target.files]; ev.target.value = ''; cargarVarios(fs, 'tests').catch(e => avisar(e)); };
  $('#fZip').onchange = ev => { const f = ev.target.files[0]; ev.target.value = ''; if (f) cargarZip(f).catch(e => avisar(e)); };
  // también se pueden soltar los archivos encima de la página
  let arrastre = 0;
  addEventListener('dragenter', e => { e.preventDefault(); arrastre++; $('#soltar').style.display = 'grid'; });
  addEventListener('dragleave', () => { if (--arrastre <= 0) { arrastre = 0; $('#soltar').style.display = 'none'; } });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', async e => {
    e.preventDefault(); arrastre = 0; $('#soltar').style.display = 'none';
    try {
      for (const f of e.dataTransfer.files) {
        if (/\.zip$/i.test(f.name)) await cargarZip(f);
        else if (/\.csv$/i.test(f.name)) await cargarVarios([f], 'csvs');
        else if (/\.py$/i.test(f.name)) await cargarVarios([f], 'tests');
        else if (/\.(pdf|md|txt|markdown)$/i.test(f.name)) await cargarEnun(f);
      }
    } catch (x) { avisar(x); }
  });
  let error = null;
  const avisar = e => { error = e && e.message ? e.message : String(e); pintar(); };

  // ───── Resolver (se vuelve a armar solo si cambia algún archivo)
  let memo = { k: null, r: null };
  function solucion() {
    if (!S.enun || !Object.keys(S.tests).length) return null;
    const k = JSON.stringify([S.enun.texto.length, S.enun.texto.slice(0, 200), Object.entries(S.csvs).map(([n, t]) => n + t.length), Object.entries(S.tests).map(([n, t]) => n + t.length + t.slice(-100)), S.carpeta]);
    if (memo.k !== k) {
      let r;
      try { r = Dao.resolver({ enunciado: S.enun.texto, csvs: S.csvs, tests: S.tests, carpetaCsv: S.carpeta || undefined }); }
      catch (e) { r = { archivos: {}, avisos: ['No pude armar la solución: ' + (e && e.message || e)], comprobacion: { ok: 0, total: 0, fallan: [] } }; }
      memo = { k, r };
    }
    return memo.r;
  }

  // ───── Pintar
  const PALABRAS = new Set('and as assert break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield True False None self super'.split(' '));
  function resaltar(l) {
    let out = '', i = 0;
    const m = l.match(/^(\s*)(.*)$/);
    out += m[1]; i = m[1].length;
    const t = l.slice(i);
    const re = /("""[\s\S]*?"""|'''[\s\S]*?'''|f?"(?:[^"\\]|\\.)*"|f?'(?:[^'\\]|\\.)*')|(#.*$)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b|(@\w+)/g;
    let ult = 0, x;
    while ((x = re.exec(t))) {
      out += esc(t.slice(ult, x.index));
      if (x[1]) out += `<span class="s">${esc(x[1])}</span>`;
      else if (x[2]) out += `<span class="c">${esc(x[2])}</span>`;
      else if (x[3]) out += `<span class="nm">${x[3]}</span>`;
      else if (x[4]) out += PALABRAS.has(x[4]) ? `<span class="kw">${x[4]}</span>` : esc(x[4]);
      else if (x[5]) out += `<span class="kw">${esc(x[5])}</span>`;
      ult = re.lastIndex;
    }
    return out + esc(t.slice(ult));
  }
  function pintarCargados() {
    const chips = [];
    if (S.enun) chips.push(['enunciado', S.enun.nombre, () => { S.enun = null; }]);
    for (const n of Object.keys(S.csvs)) chips.push(['csv', n, () => { delete S.csvs[n]; }]);
    for (const n of Object.keys(S.tests)) chips.push(['test', n, () => { delete S.tests[n]; }]);
    $('#cargados').innerHTML = chips.map(([t, n], i) => `<span class="chip"><b>${t}</b><span title="${esc(n)}">${esc(n)}</span><button data-sacar="${i}" title="Sacar" aria-label="Sacar ${esc(n)}">×</button></span>`).join('');
    $('#cargados').querySelectorAll('[data-sacar]').forEach(b => b.onclick = () => { chips[b.dataset.sacar][2](); guardar(); pintar(); });
  }
  function pintar() {
    pintarCargados();
    const el = $('#solucion');
    const falta = [!S.enun && 'el enunciado', !Object.keys(S.csvs).length && 'el CSV', !Object.keys(S.tests).length && 'el test'].filter(Boolean);
    let h = error ? `<div class="aviso mal">${esc(error)}</div>` : '';
    error = null;
    const r = solucion();
    if (!r) { el.innerHTML = h + `<p class="vacio">Cargá ${falta.join(', ').replace(/, ([^,]*)$/, ' y $1')} del parcial (o el ZIP con todo, o soltalos acá) y aparece el programa en Python resuelto: las clases, la colección y el main que lee el CSV.</p>`; return; }
    const nombres = Object.keys(r.archivos);
    if (!nombres.length) { el.innerHTML = h + `<div class="aviso mal">${esc(r.avisos.join(' '))}</div>`; return; }
    if (!nombres.includes(S.archivo)) S.archivo = nombres[0];
    const c = r.comprobacion;
    const estado = [`enunciado: <b>${esc(S.enun.nombre)}</b>`, `CSV: <b>${esc(Object.keys(S.csvs).join(', ') || '—')}</b>`, `test: <b>${esc(Object.keys(S.tests).join(', '))}</b>`];
    if (c.total) estado.push(c.ok === c.total ? `<span class="ok">✓ cumple las ${c.total} comprobaciones del test</span>` : `<span class="mal">✗ cumple ${c.ok} de ${c.total} comprobaciones del test</span>`);
    if (falta.length) estado.push(`falta ${falta.join(' y ')}`);
    h += `<div class="s-estado">${estado.join(' · ')}</div>`;
    if (r.avisos.length) h += `<div class="aviso">Esto revisalo vos:<ul>${r.avisos.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
    const lineas = r.archivos[S.archivo].replace(/\n$/, '').split('\n');
    h += `<div class="cod-env"><div class="archivos">${nombres.map(n => `<button data-arch="${esc(n)}" class="${n === S.archivo ? 'on' : ''}">${esc(n)}</button>`).join('')}</div>
      <div class="codigo">${lineas.map((l, i) => `<div class="ln"><i>${i + 1}</i><span>${resaltar(l) || ' '}</span></div>`).join('')}</div></div>
      <p class="nota">Para probarlo: poné estos archivos junto al test${r.carpetaCsv ? `, los CSV en la carpeta <code>${esc(r.carpetaCsv)}/</code>` : ' y al CSV'}, y corré <code>python -m pytest</code> (los tests) y <code>python ${esc(nombres.includes('main.py') ? 'main.py' : nombres[0])}</code> (los resultados). «Descargar ZIP» trae todo junto.</p>`;
    el.innerHTML = h;
    el.querySelectorAll('[data-arch]').forEach(b => b.onclick = () => { S.archivo = b.dataset.arch; guardar(); pintar(); });
    $('#bCopiar').textContent = 'Copiar ' + S.archivo;
  }
  $('#bCopiar').onclick = ev => { const r = solucion(); if (r && r.archivos[S.archivo]) copiar(r.archivos[S.archivo], ev.currentTarget); };
  $('#bBorrar').onclick = () => { S.enun = null; S.csvs = {}; S.tests = {}; S.archivo = null; S.carpeta = null; memo = { k: null, r: null }; guardar(); pintar(); $('#bCopiar').textContent = 'Copiar'; };
  $('#bBajar').onclick = () => {
    const r = solucion();
    if (!r || !Object.keys(r.archivos).length) return;
    const R = 'parcial-dao/', lista = [];
    for (const [n, t] of Object.entries(r.archivos)) lista.push([R + n, t]);
    for (const [n, t] of Object.entries(S.csvs)) lista.push([R + (r.carpetaCsv ? r.carpetaCsv + '/' : '') + n, t]);
    for (const [n, t] of Object.entries(S.tests)) lista.push([R + n, t]);
    bajar('parcial-dao.zip', zip(lista));
  };
  function bajar(nombre, blob) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  function copiar(t, btn) {
    const v = btn.textContent, mostrar = m => { btn.textContent = m; setTimeout(() => btn.textContent = v, 1200); };
    const x = document.createElement('textarea');
    x.value = t; x.setAttribute('readonly', ''); x.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(x); x.select();
    let hecho = false;
    try { hecho = document.execCommand('copy'); } catch (e) { /* no la deja */ }
    x.remove(); btn.focus();
    if (hecho) return mostrar('¡Copiado!');
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => mostrar('¡Copiado!'), () => mostrar('No pude copiar'));
    else mostrar('No pude copiar');
  }
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zip(archivos) {           // ZIP sin comprimir (método 0), nombres en UTF-8
    const enc = new TextEncoder(), partes = [], centro = []; let pos = 0;
    const d = new Date(), fecha = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(), hora = (d.getHours() << 11) | (d.getMinutes() << 5);
    for (const [nombre, texto] of archivos) {
      const n = enc.encode(nombre), dat = enc.encode(texto), crc = crc32(dat);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, hora, true); h.setUint16(12, fecha, true); h.setUint32(14, crc, true); h.setUint32(18, dat.length, true); h.setUint32(22, dat.length, true);
      h.setUint16(26, n.length, true); h.setUint16(28, 0, true);
      partes.push(new Uint8Array(h.buffer), n, dat);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, hora, true); c.setUint16(14, fecha, true); c.setUint32(16, crc, true); c.setUint32(20, dat.length, true); c.setUint32(24, dat.length, true);
      c.setUint16(28, n.length, true); c.setUint32(42, pos, true);
      centro.push(new Uint8Array(c.buffer), n);
      pos += 30 + n.length + dat.length;
    }
    const tam = centro.reduce((s, x) => s + x.length, 0);
    const f = new DataView(new ArrayBuffer(22));
    f.setUint32(0, 0x06054b50, true); f.setUint16(8, archivos.length, true); f.setUint16(10, archivos.length, true); f.setUint32(12, tam, true); f.setUint32(16, pos, true);
    return new Blob([...partes, ...centro, new Uint8Array(f.buffer)], { type: 'application/zip' });
  }

  // ───── Hay una versión más nueva publicada (solo desde el sitio)
  if (/^https?:/.test(location.protocol)) fetch('laboratorio-dao-version.txt?' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(v => {
    v = v.trim();
    if (v && v !== VERSION) $('#avisoVersion').innerHTML = `<div class="aviso-version">Hay una versión más nueva del laboratorio · <a href="laboratorio-dao.html?v=${esc(v)}">Actualizar</a></div>`;
  }).catch(() => {});

  window.__lab = { S, solucion };
  pintar();
})();
